name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data pack (release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4; do
            if gh release download pack-data -R "$GITHUB_REPOSITORY" -p pack-data.tar.gz -D /tmp --clobber; then break; fi
            echo "retry $i"; sleep 10
          done
          test -f /tmp/pack-data.tar.gz
          rm -rf data && tar -xzf /tmp/pack-data.tar.gz
          test -f data/latest/manifest.json
          cat data/latest/manifest.json | head -c 300
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js icons vendor data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages@v4 can race the just-uploaded artifact and fail immediately
      # with "Found 0 artifact(s)" / "Fetching artifact metadata failed".
      # Sleep, then retry up to 3 attempts in this same job so a later success
      # still concludes the workflow run as success. auto_update.py only
      # dispatches this workflow and does not wait; a re-dispatched second run
      # would leave the first run red, so retries stay in-job.
      # concurrency (group: pages, cancel-in-progress: false) is unchanged.
      - name: Wait for Pages artifact to be visible
        run: sleep 12
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before Pages deploy retry 2
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: deployment2
        name: Deploy to GitHub Pages (retry 2)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before Pages deploy retry 3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 25
      - id: deployment3
        name: Deploy to GitHub Pages (retry 3)
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Confirm Pages deploy succeeded
        if: steps.deployment.outcome == 'success' || steps.deployment2.outcome == 'success' || steps.deployment3.outcome == 'success'
        run: |
          echo "Pages deploy succeeded (attempt outcomes: 1=${{ steps.deployment.outcome }} 2=${{ steps.deployment2.outcome }} 3=${{ steps.deployment3.outcome }})"
